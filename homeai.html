<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeAI V0.5</title>

<style>
body {
    margin: 0;
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    font-size: 40px;
    margin-bottom: 5px;
}

.status {
    color: #aaa;
    margin-bottom: 30px;
}

#micro {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: none;
    font-size: 60px;
    cursor: pointer;
}

#micro.ecoute {
    transform: scale(1.08);
}

#texte {
    margin-top: 30px;
    font-size: 21px;
    min-height: 40px;
}

#resultat {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    background: #1c1e23;
    text-align: left;
    font-size: 18px;
    line-height: 1.7;
}

#appareils {
    margin-top: 25px;
    padding: 20px;
    border-radius: 20px;
    background: #181a1f;
    text-align: left;
}

.appareil {
    padding: 10px 0;
    border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<div class="container">

<h1>🏠 HomeAI</h1>

<div class="status" id="status">
Prêt à écouter
</div>

<button id="micro">🎙️</button>

<div id="texte">
Appuie sur le micro et parle.
</div>

<div id="resultat">
🧠 HomeAI : aucune commande.
</div>

<div id="appareils">
<h2>🏠 Maison</h2>

<div class="appareil">
📺 Salon → TV → 📡 électronique
</div>

<div class="appareil">
💡 Salon → Lumière → 📡 électronique
</div>

<div class="appareil">
🪟 Salon → Volets → 📡 électronique
</div>

<div class="appareil">
🍳 Cuisine → Four → 📡 électronique
</div>

<div class="appareil">
❄️ Cuisine → Frigo → 🤖 mécanique
</div>

<div class="appareil">
💡 Chambre → Lumière → 📡 électronique
</div>

</div>

</div>


<script>

/* =========================================
   RECONNAISSANCE VOCALE
========================================= */

const micro = document.getElementById("micro");
const texte = document.getElementById("texte");
const resultat = document.getElementById("resultat");
const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.innerText =
        "Reconnaissance vocale non disponible.";

} else {

    const reconnaissance = new SpeechRecognition();

    reconnaissance.lang = "fr-FR";
    reconnaissance.continuous = false;
    reconnaissance.interimResults = false;


    micro.addEventListener("click", () => {

        reconnaissance.start();

        status.innerText = "🎙️ J'écoute...";
        micro.classList.add("ecoute");

    });


    reconnaissance.onresult = function(event) {

        const commande =
            event.results[0][0].transcript;

        texte.innerText =
            "🗣️ « " + commande + " »";

        analyserCommande(commande);

    };


    reconnaissance.onend = function() {

        status.innerText = "Prêt à écouter";

        micro.classList.remove("ecoute");

    };


    reconnaissance.onerror = function(event) {

        status.innerText =
            "Erreur : " + event.error;

        micro.classList.remove("ecoute");

    };

}


/* =========================================
   BASE DES APPAREILS
========================================= */

const appareils = [

    {
        nom: "TV",
        piece: "salon",
        type: "electronique"
    },

    {
        nom: "LUMIERE",
        piece: "salon",
        type: "electronique"
    },

    {
        nom: "VOLETS",
        piece: "salon",
        type: "electronique"
    },

    {
        nom: "FOUR",
        piece: "cuisine",
        type: "electronique"
    },

    {
        nom: "FRIGO",
        piece: "cuisine",
        type: "mecanique"
    },

    {
        nom: "LUMIERE",
        piece: "chambre",
        type: "electronique"
    }

];


/* =========================================
   ANALYSE DE LA COMMANDE
========================================= */

function analyserCommande(commande) {

    const c = commande.toLowerCase();

    let appareil = null;
    let action = null;
    let piece = null;
    let valeur = null;


    /* -------- PIÈCE -------- */

    if (c.includes("salon")) {
        piece = "salon";
    }

    else if (c.includes("cuisine")) {
        piece = "cuisine";
    }

    else if (c.includes("chambre")) {
        piece = "chambre";
    }


    /* -------- TV -------- */

    if (
        c.includes("télé") ||
        c.includes("tele") ||
        c.includes("tv")
    ) {

        appareil = "TV";

        if (
            c.includes("allume") ||
            c.includes("mets") ||
            c.includes("regarder")
        ) {
            action = "ALLUMER";
        }

        else if (
            c.includes("éteins") ||
            c.includes("eteins")
        ) {
            action = "ÉTEINDRE";
        }
    }


    /* -------- LUMIÈRE -------- */

    else if (
        c.includes("lumière") ||
        c.includes("lumiere") ||
        c.includes("lampe")
    ) {

        appareil = "LUMIERE";

        if (
            c.includes("allume") ||
            c.includes("mets")
        ) {
            action = "ALLUMER";
        }

        else if (
            c.includes("éteins") ||
            c.includes("eteins")
        ) {
            action = "ÉTEINDRE";
        }
    }


    /* -------- VOLETS -------- */

    else if (c.includes("volet")) {

        appareil = "VOLETS";

        if (
            c.includes("ouvre") ||
            c.includes("ouvrir")
        ) {
            action = "OUVRIR";
        }

        else if (
            c.includes("ferme") ||
            c.includes("fermer")
        ) {
            action = "FERMER";
        }
    }


    /* -------- FRIGO -------- */

    else if (
        c.includes("frigo") ||
        c.includes("réfrigérateur") ||
        c.includes("refrigerateur")
    ) {

        appareil = "FRIGO";

        if (
            c.includes("ouvre") ||
            c.includes("ouvrir")
        ) {
            action = "OUVRIR";
        }

        else if (
            c.includes("ferme") ||
            c.includes("fermer")
        ) {
            action = "FERMER";
        }
    }


    /* -------- FOUR -------- */

    else if (c.includes("four")) {

        appareil = "FOUR";

        for (let i = 50; i <= 300; i++) {

            if (c.includes(i.toString())) {

                valeur = i + "°C";
                action = "RÉGLER";

                break;
            }
        }
    }


    /* =========================================
       RECHERCHE DANS LA MAISON
    ========================================= */

    if (appareil === null || action === null) {

        resultat.innerHTML =
            "🤖 <strong>HomeAI :</strong><br><br>" +
            "Je n'ai pas compris la commande.";

        return;
    }


    let appareilTrouve = null;


    for (const a of appareils) {

        if (a.nom === appareil) {

            if (
                piece === null ||
                a.piece === piece
            ) {

                appareilTrouve = a;
                break;

            }
        }
    }


    /* =========================================
       APPAREIL TROUVÉ
    ========================================= */

    if (appareilTrouve !== null) {

        resultat.innerHTML =

            "🧠 <strong>HomeAI a compris :</strong><br><br>" +

            "📦 Appareil : <strong>" +
            appareilTrouve.nom +
            "</strong><br>" +

            "🏠 Pièce : <strong>" +
            appareilTrouve.piece +
            "</strong><br>" +

            "⚙️ Action : <strong>" +
            action +
            "</strong><br>" +

            "🔧 Module : <strong>" +
            appareilTrouve.type +
            "</strong><br>" +

            "📊 Valeur : <strong>" +
            (valeur || "aucune") +
            "</strong>";

    }

    else {

        resultat.innerHTML =

            "🤖 <strong>HomeAI :</strong><br><br>" +

            "J'ai compris la commande, mais je ne trouve pas " +

            "<strong>" + appareil + "</strong>" +

            " dans cette pièce.";

    }

}

</script>

</body>
</html>
