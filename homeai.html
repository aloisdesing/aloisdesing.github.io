            .map(module => {

/* =====================================================
   CHERCHER UN MOT
===================================================== */

function contientUnMot(texte, liste) {

    for (const mot of liste) {

        if (texte.includes(mot)) {
            return true;
        }

    }

    return false;
}


/* =====================================================
   TROUVER L'APPAREIL
===================================================== */

function trouverAppareil(texte) {

    /*
       On cherche le mot le plus précis.
       Les noms longs passent en premier.
    */

    const appareilsTries = [...appareils].sort(
        (a, b) => {

            const longueurA =
                Math.max(...a.mots.map(m => m.length));

            const longueurB =
                Math.max(...b.mots.map(m => m.length));

            return longueurB - longueurA;
        }
    );


    for (const appareil of appareilsTries) {

        for (const mot of appareil.mots) {

            if (texte.includes(mot)) {

                return appareil;

            }

        }

    }

    return null;
}


/* =====================================================
   CHOISIR LE MODULE
===================================================== */

function choisirModule(appareil, action) {

    const actionsMecaniques = [
        "OUVRIR",
        "FERMER",
        "MONTER",
        "DESCENDRE",
        "VERROUILLER",
        "DÉVERROUILLER"
    ];


    if (
        actionsMecaniques.includes(action) &&
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    if (
        appareil.modules.includes("electronique")
    ) {

        return "⚡ ÉLECTRONIQUE";

    }


    if (
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    return "❓ INCONNU";

}


/* =====================================================
   DÉTECTER LA PIÈCE
===================================================== */

function trouverPiece(texte, appareil) {

    if (
        texte.includes("salon") ||
        texte.includes("séjour") ||
        texte.includes("sejour")
    ) {
        return "salon";
    }

    if (texte.includes("cuisine")) {
        return "cuisine";
    }

    if (texte.includes("chambre")) {
        return "chambre";
    }

    if (texte.includes("salle de bain")) {
        return "salle de bain";
    }

    return appareil.piece;
}


/* =====================================================
   ANALYSER UNE COMMANDE SIMPLE
===================================================== */

function analyserCommandeSimple(commande) {

    let c = commande
        .toLowerCase()
        .replace(/[.,!?]/g, "")
        .trim();


    let action = null;
    let valeur = null;


    /* ACTION */

    if (contientUnMot(c, vocabulaire.ouvrir)) {

        action = "OUVRIR";

    }

    else if (contientUnMot(c, vocabulaire.fermer)) {

        action = "FERMER";

    }

    else if (contientUnMot(c, vocabulaire.monter)) {

        action = "MONTER";

    }

    else if (contientUnMot(c, vocabulaire.descendre)) {

        action = "DESCENDRE";

    }

    else if (contientUnMot(c, vocabulaire.eteindre)) {

        action = "ÉTEINDRE";

    }

    else if (contientUnMot(c, vocabulaire.allumer)) {

        action = "ALLUMER";

    }


    /* TEMPÉRATURE */

    for (let i = 5; i <= 300; i++) {

        if (c.includes(i.toString())) {

            if (
                c.includes("degré") ||
                c.includes("degres") ||
                c.includes("°") ||
                c.includes("température") ||
                c.includes("temperature")
            ) {

                valeur = i + "°C";
                action = "RÉGLER";

                break;

            }

        }

    }


    const appareil = trouverAppareil(c);


    if (
        appareil === null ||
        action === null
    ) {

        return null;

    }


    const piece = trouverPiece(
        c,
        appareil
    );


    const module = choisirModule(
        appareil,
        action
    );


    return {

        appareil: appareil.nom,
        emoji: appareil.emoji,
        piece: piece,
        action: action,
        module: module,
        valeur: valeur || "aucune"

    };

}


/* =====================================================
   DÉCOUPER PLUSIEURS COMMANDES
===================================================== */

function decouperCommandes(phrase) {

    let texte = phrase
        .toLowerCase()
        .trim();


    /*
       On transforme les différents séparateurs
       en un séparateur commun.
    */

    texte = texte
        .replace(/\s+ensuite\s+/g, "|")
        .replace(/\s+puis\s+/g, "|")
        .replace(/\s+après\s+/g, "|")
        .replace(/\s+apres\s+/g, "|");


    /*
       "et" devient séparateur uniquement
       lorsqu'il semble introduire une nouvelle
       action.
    */

    texte = texte
        .replace(
            /\s+et\s+(allume|allumer|éteins|eteins|ouvre|ouvrir|ferme|fermer|mets|met|active|activer|lance|lancer|monte|monter|descends|descendre|baisse|baisser)/g,
            "|$1"
        );


    /*
       Virgules et points-virgules.
    */

    texte = texte
        .replace(/,/g, "|")
        .replace(/;/g, "|");


    return texte
        .split("|")
        .map(x => x.trim())
        .filter(x => x.length > 0);

}


/* =====================================================
   ANALYSER PLUSIEURS COMMANDES
===================================================== */

function analyserPlusieursCommandes(phrase) {

    const commandes =
        decouperCommandes(phrase);


    const resultats = [];


    for (const commande of commandes) {

        const resultatCommande =
            analyserCommandeSimple(commande);


        if (resultatCommande !== null) {

            resultats.push(
                resultatCommande
            );

        }

    }


    /* ===============================================
       AUCUNE COMMANDE COMPRISE
    =============================================== */

    if (resultats.length === 0) {

        resultat.innerHTML =

            "🤖 <strong>HomeAI :</strong><br><br>" +

            "Je n'ai pas compris la commande.<br><br>" +

            "Essaie par exemple :<br>" +

            "« Allume la lumière et ouvre les volets »";

        return;

    }


    /* ===============================================
       AFFICHAGE
    =============================================== */

    let html =

        "🧠 <strong>HomeAI a compris " +

        resultats.length +

        " commande(s) :</strong><br><br>";


    resultats.forEach((commande, index) => {

        html +=

            "<div class='commande'>" +

            "<span class='numero'>" +
            (index + 1) +
            "️⃣</span><br><br>" +

            "📦 Appareil : <strong>" +
            commande.emoji +
            " " +
            commande.appareil +
            "</strong><br>" +

            "🏠 Pièce : <strong>" +
            commande.piece +
            "</strong><br>" +

            "⚙️ Action : <strong>" +
            commande.action +
            "</strong><br>" +

            "🔧 Module : <strong>" +
            commande.module +
            "</strong><br>" +

            "📊 Valeur : <strong>" +
            commande.valeur +
            "</strong>" +

            "</div>";

    });


    html +=

        "📡 <strong>" +
        resultats.length +
        " commande(s) prête(s) à être envoyée(s).</strong>";


    resultat.innerHTML = html;

}
