   RECONNAISSANCE VOCALE
===================================================== */

const texte = document.getElementById("texte");
const resultat = document.getElementById("resultat");
const status = document.getElementById("status");
const listeMaison = document.getElementById("listeMaison");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.innerText =
        "❌ Reconnaissance vocale non disponible.";

} else {

    const reconnaissance = new SpeechRecognition();

    reconnaissance.lang = "fr-FR";
    reconnaissance.continuous = false;
    reconnaissance.interimResults = false;


    micro.addEventListener("click", () => {

        try {

            reconnaissance.start();

            status.innerText = "🎙️ J'écoute...";
            micro.classList.add("ecoute");

        } catch (erreur) {

            console.log(erreur);

        }

    });


    reconnaissance.onresult = function(event) {

        const commande =
            event.results[0][0].transcript;

        texte.innerText =
            "🗣️ « " + commande + " »";

        analyserCommande(commande);

    };


    reconnaissance.onend = function() {

        status.innerText = "Prêt à écouter";

        micro.classList.remove("ecoute");

    };


    reconnaissance.onerror = function(event) {

        status.innerText =
            "Erreur : " + event.error;

        micro.classList.remove("ecoute");

    };

}

/* =====================================================
   AFFICHAGE DE LA MAISON
===================================================== */

function afficherMaison() {

    listeMaison.innerHTML = "";

    for (const appareil of appareils) {

        const div = document.createElement("div");

        div.className = "objet";

        let modules = appareil.modules
            .map(module => {

                if (module === "electronique") {
                    return "⚡ électronique";
                }

                return "🤖 mécanique";

            })
            .join(" + ");

        div.innerHTML =
            appareil.emoji +
            " <strong>" +
            appareil.nom +
            "</strong>" +
            " — " +
            appareil.piece +
            "<br>" +
            "<span class='badge'>" +
            modules +
            "</span>";

        listeMaison.appendChild(div);

    }

}

/* =====================================================
   CHERCHER UN MOT
===================================================== */

function contientUnMot(texte, liste) {

    for (const mot of liste) {

        if (texte.includes(mot)) {
            return true;
        }

    }

    return false;
}


/* =====================================================
   TROUVER L'APPAREIL
===================================================== */

function trouverAppareil(texte) {

    for (const appareil of appareils) {

        for (const mot of appareil.mots) {

            if (texte.includes(mot)) {

                return appareil;

            }

        }

    }

    return null;
}


/* =====================================================
   CHOISIR LE MODULE
===================================================== */

function choisirModule(appareil, action) {

    /*
       Si l'action concerne un mouvement,
       on privilégie le module mécanique.

       Sinon on privilégie l'électronique.
    */

    const actionsMecaniques = [
        "OUVRIR",
        "FERMER",
        "MONTER",
        "DESCENDRE",
        "VERROUILLER",
        "DÉVERROUILLER"
    ];


    if (
        actionsMecaniques.includes(action) &&
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    if (
        appareil.modules.includes("electronique")
    ) {

        return "⚡ ÉLECTRONIQUE";

    }


    if (
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    return "❓ INCONNU";

}


/* =====================================================
   ANALYSER LA COMMANDE
===================================================== */

function analyserCommande(commande) {

    let c = commande
        .toLowerCase()
        .replace(/[.,!?]/g, "")
        .trim();


    let action = null;
    let valeur = null;


    /* ===============================
       ACTIONS
    =============================== */

    if (
        contientUnMot(c, vocabulaire.ouvrir)
    ) {

        action = "OUVRIR";

    }

    else if (
        contientUnMot(c, vocabulaire.fermer)
    ) {

        action = "FERMER";

    }

    else if (
        contientUnMot(c, vocabulaire.monter)
    ) {

        action = "MONTER";

    }

    else if (
        contientUnMot(c, vocabulaire.descendre)
    ) {

        action = "DESCENDRE";

    }

    else if (
        contientUnMot(c, vocabulaire.eteindre)
    ) {

        action = "ÉTEINDRE";

    }

    else if (
        contientUnMot(c, vocabulaire.allumer)
    ) {

        action = "ALLUMER";

    }


    /* ===============================
       TEMPÉRATURE
    =============================== */

    for (let i = 5; i <= 300; i++) {

        if (c.includes(i.toString())) {

            if (
                c.includes("degré") ||
                c.includes("degres") ||
                c.includes("°") ||
                c.includes("température") ||
                c.includes("temperature")
            ) {

                valeur = i + "°C";

                action = "RÉGLER";

                break;

            }

        }

    }


    /* ===============================
       TROUVER APPAREIL
    =============================== */

    const appareil = trouverAppareil(c);


    if (
        appareil === null ||
        action === null
    ) {

        resultat.innerHTML =

            "🤖 <strong>HomeAI :</strong><br><br>" +

            "Je n'ai pas encore compris cette commande.<br><br>" +

            "🗣️ Essaie par exemple :<br>" +

            "« Ouvre le frigo »<br>" +

            "« Ferme les volets »<br>" +

            "« Allume la lumière »<br>" +

            "« Mets le chauffage à 21 degrés »";

        return;

    }


    /* ===============================
       MODULE
    =============================== */

    const module = choisirModule(
        appareil,
        action
    );


    /* ===============================
       PIÈCE
    =============================== */

    let piece = appareil.piece;

    if (c.includes("salon")) {
        piece = "salon";
    }

    else if (c.includes("cuisine")) {
        piece = "cuisine";
    }

    else if (c.includes("chambre")) {
        piece = "chambre";
    }

    else if (c.includes("salle de bain")) {
        piece = "salle de bain";
    }


    /* ===============================
       AFFICHAGE
    =============================== */

    resultat.innerHTML =

        "🧠 <strong>HomeAI a compris :</strong><br><br>" +

        "📦 Appareil : <strong>" +
        appareil.emoji +
        " " +
        appareil.nom +
        "</strong><br>" +

        "🏠 Pièce : <strong>" +
        piece +
        "</strong><br>" +

        "⚙️ Action : <strong>" +
        action +
        "</strong><br>" +

        "🔧 Module utilisé : <strong>" +
        module +
        "</strong><br>" +

        "📊 Valeur : <strong>" +
        (valeur || "aucune") +
        "</strong><br><br>" +

        "📡 <strong>Commande prête à être envoyée.</strong>";

}
