<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeAI V0.4</title>

<style>
body {
    margin: 0;
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 35px 20px;
}

h1 {
    font-size: 40px;
    margin-bottom: 5px;
}

.status {
    color: #aaa;
    margin-bottom: 35px;
}

#micro {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: none;
    font-size: 60px;
    cursor: pointer;
}

#micro.ecoute {
    transform: scale(1.08);
}

#texte {
    margin-top: 35px;
    font-size: 21px;
    min-height: 40px;
}

#resultat {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    background: #1c1e23;
    text-align: left;
    font-size: 19px;
    line-height: 1.7;
}

.label {
    color: #999;
}
</style>
</head>

<body>

<div class="container">

<h1>🏠 HomeAI</h1>

<div class="status" id="status">
Prêt à écouter
</div>

<button id="micro">🎙️</button>

<div id="texte">
Appuie sur le micro et parle.
</div>

<div id="resultat">
<span class="label">HomeAI :</span><br>
Aucune commande.
</div>

</div>


<script>

const micro = document.getElementById("micro");
const texte = document.getElementById("texte");
const resultat = document.getElementById("resultat");
const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.innerText =
        "Reconnaissance vocale non disponible.";

} else {

    const reconnaissance = new SpeechRecognition();

    reconnaissance.lang = "fr-FR";
    reconnaissance.continuous = false;
    reconnaissance.interimResults = false;


    micro.addEventListener("click", () => {

        reconnaissance.start();

        status.innerText = "🎙️ J'écoute...";
        micro.classList.add("ecoute");

    });


    reconnaissance.onresult = function(event) {

        const commande =
            event.results[0][0].transcript;

        texte.innerText =
            "🗣️ « " + commande + " »";

        analyserCommande(commande);

    };


    reconnaissance.onend = function() {

        status.innerText =
            "Prêt à écouter";

        micro.classList.remove("ecoute");

    };


    reconnaissance.onerror = function(event) {

        status.innerText =
            "Erreur : " + event.error;

        micro.classList.remove("ecoute");

    };

}


/* ==================================
   CERVEAU HOMEAI
================================== */

function analyserCommande(commande) {

    const c = commande.toLowerCase();

    let appareil = null;
    let action = null;
    let piece = "non précisée";
    let valeur = null;
    let type = "électronique";


    /* PIÈCE */

    if (c.includes("salon")) {
        piece = "salon";
    }

    else if (c.includes("chambre")) {
        piece = "chambre";
    }

    else if (c.includes("cuisine")) {
        piece = "cuisine";
    }

    else if (c.includes("salle de bain")) {
        piece = "salle de bain";
    }


    /* ==============================
       TÉLÉ
    ============================== */

    if (
        c.includes("télé") ||
        c.includes("tele") ||
        c.includes("tv")
    ) {

        appareil = "TV";

        if (
            c.includes("allume") ||
            c.includes("mets") ||
            c.includes("regarder")
        ) {
            action = "ALLUMER";
        }

        else if (
            c.includes("éteins") ||
            c.includes("eteins")
        ) {
            action = "ÉTEINDRE";
        }
    }


    /* ==============================
       LUMIÈRE
    ============================== */

    else if (
        c.includes("lumière") ||
        c.includes("lumiere") ||
        c.includes("lampe")
    ) {

        appareil = "LUMIÈRE";

        if (
            c.includes("allume") ||
            c.includes("mets")
        ) {
            action = "ALLUMER";
        }

        else if (
            c.includes("éteins") ||
            c.includes("eteins")
        ) {
            action = "ÉTEINDRE";
        }
    }


    /* ==============================
       CHAUFFAGE
    ============================== */

    else if (
        c.includes("chauffage") ||
        c.includes("radiateur")
    ) {

        appareil = "CHAUFFAGE";

        for (let i = 5; i <= 35; i++) {

            if (c.includes(i.toString())) {

                valeur = i + "°C";
                action = "RÉGLER";
                break;

            }
        }
    }


    /* ==============================
       VOLETS
    ============================== */

    else if (c.includes("volet")) {

        appareil = "VOLETS";

        if (
            c.includes("ouvre") ||
            c.includes("ouvrir")
        ) {
            action = "OUVRIR";
        }

        else if (
            c.includes("ferme") ||
            c.includes("fermer")
        ) {
            action = "FERMER";
        }
    }


    /* ==============================
       SPOTIFY
    ============================== */

    else if (
        c.includes("spotify") ||
        c.includes("musique")
    ) {

        appareil = "MUSIQUE";
        action = "LANCER";
        valeur = "Spotify";
    }


    /* ==============================
       FRIGO
    ============================== */

    else if (
        c.includes("frigo") ||
        c.includes("réfrigérateur") ||
        c.includes("refrigerateur")
    ) {

        appareil = "FRIGO";
        type = "mécanique";

        if (
            c.includes("ouvre") ||
            c.includes("ouvrir")
        ) {
            action = "OUVRIR";
        }

        else if (
            c.includes("ferme") ||
            c.includes("fermer")
        ) {
            action = "FERMER";
        }
    }


    /* ==============================
       FOUR
    ============================== */

    else if (c.includes("four")) {

        appareil = "FOUR";

        for (let i = 50; i <= 300; i++) {

            if (c.includes(i.toString())) {

                valeur = i + "°C";
                action = "RÉGLER";
                break;

            }
        }
    }


    /* ==============================
       COMMANDE INCOMPRISE
    ============================== */

    if (appareil === null || action === null) {

        resultat.innerHTML =
            "<span class='label'>🤖 HomeAI</span><br><br>" +
            "Je n'ai pas compris la commande.";

        return;
    }


    /* ==============================
       COMMANDE STRUCTURÉE
    ============================== */

    resultat.innerHTML =

        "<span class='label'>🧠 HomeAI a compris :</span><br><br>" +

        "📦 <strong>Appareil :</strong> " +
        appareil + "<br>" +

        "⚙️ <strong>Action :</strong> " +
        action + "<br>" +

        "🏠 <strong>Pièce :</strong> " +
        piece + "<br>" +

        "🔧 <strong>Type :</strong> " +
        type + "<br>" +

        "📊 <strong>Valeur :</strong> " +
        (valeur || "aucune");

}

</script>

</body>
</html>
