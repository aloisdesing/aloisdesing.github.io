===================================================== */

const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let reconnaissance = null;


if (!SpeechRecognition) {

    status.innerText =
        "❌ Reconnaissance vocale indisponible.";

} else {

    reconnaissance = new SpeechRecognition();

    reconnaissance.lang = "fr-FR";
    reconnaissance.continuous = false;
    reconnaissance.interimResults = false;


    micro.addEventListener("click", () => {

        try {

            reconnaissance.start();

            status.innerText = "🎙️ J'écoute...";
            micro.classList.add("ecoute");

        } catch (e) {

            console.log(e);

        }

    });


    reconnaissance.onresult = function(event) {

        const phrase =
            event.results[0][0].transcript;

        texte.innerText =
            "🗣️ « " + phrase + " »";

        analyserPhrase(phrase);

    };


    reconnaissance.onend = function() {

        status.innerText = "Prêt à écouter";

        micro.classList.remove("ecoute");

    };


    reconnaissance.onerror = function(event) {

        status.innerText =
            "Erreur : " + event.error;

        micro.classList.remove("ecoute");

    };

}

/* =====================================================
   UTILITAIRES
===================================================== */

function contient(texte, liste) {

    return liste.some(
        mot => texte.includes(mot)
    );

}


function nettoyer(texte) {

    return texte
        .toLowerCase()
        .replace(/[!?]/g, "")
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   PIÈCES
===================================================== */

function detecterPiece(texte) {

    if (
        texte.includes("salle de bain") ||
        texte.includes("salle de bains")
    ) {
        return "salle de bain";
    }

    if (
        texte.includes("chambre")
    ) {
        return "chambre";
    }

    if (
        texte.includes("cuisine")
    ) {
        return "cuisine";
    }

    if (
        texte.includes("salon") ||
        texte.includes("séjour") ||
        texte.includes("sejour")
    ) {
        return "salon";
    }

    return null;
}


/* =====================================================
   TROUVER APPAREIL
===================================================== */

function trouverAppareil(texte) {

    const liste = [...appareils].sort(
        (a, b) => {

            const maxA =
                Math.max(...a.mots.map(x => x.length));

            const maxB =
                Math.max(...b.mots.map(x => x.length));

            return maxB - maxA;

        }
    );


    for (const appareil of liste) {

        for (const mot of appareil.mots) {

            if (texte.includes(mot)) {

                return appareil;

            }

        }

    }

    return null;
}


/* =====================================================
   ACTION
===================================================== */

function detecterAction(texte) {

    if (
        contient(texte, vocabulaire.ouvrir)
    ) {
        return "OUVRIR";
    }

    if (
        contient(texte, vocabulaire.fermer)
    ) {
        return "FERMER";
    }

    if (
        contient(texte, vocabulaire.verrouiller)
    ) {
        return "VERROUILLER";
    }

    if (
        contient(texte, vocabulaire.monter)
    ) {
        return "MONTER";
    }

    if (
        contient(texte, vocabulaire.descendre)
    ) {
        return "DESCENDRE";
    }

    if (
        contient(texte, vocabulaire.eteindre)
    ) {
        return "ÉTEINDRE";
    }

    if (
        contient(texte, vocabulaire.allumer)
    ) {
        return "ALLUMER";
    }

    return null;
}


/* =====================================================
   VALEUR / TEMPÉRATURE
===================================================== */

function detecterValeur(texte) {

    const correspondance =
        texte.match(
            /(\d{1,3})\s*(?:°|degr[eé]s?)/i
        );

    if (correspondance) {

        return correspondance[1] + "°C";

    }

    return null;
}


/* =====================================================
   MODULE
===================================================== */

function choisirModule(appareil, action) {

    const actionsMecaniques = [

        "OUVRIR",
        "FERMER",
        "MONTER",
        "DESCENDRE",
        "VERROUILLER"

    ];


    if (
        actionsMecaniques.includes(action) &&
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    if (
        appareil.modules.includes("electronique")
    ) {

        return "⚡ ÉLECTRONIQUE";

    }


    if (
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    return "❓ INCONNU";
}


/* =====================================================
   ANALYSER UNE COMMANDE
===================================================== */

function analyserCommande(texte) {

    const appareil =
        trouverAppareil(texte);

    const action =
        detecterAction(texte);

    const pieceDemandee =
        detecterPiece(texte);

    const valeur =
        detecterValeur(texte);


    if (
        !appareil ||
        !action
    ) {

        return null;

    }


    let piece = pieceDemandee;


    /*
       Si aucune pièce n'est donnée,
       on prend une pièce compatible.
    */

    if (!piece) {

        piece = appareil.pieces[0];

    }


    /*
       Vérification de la pièce.
    */

    if (
        !appareil.pieces.includes(piece)
    ) {

        piece = appareil.pieces[0];

    }


    let vraieAction = action;


    if (valeur !== null) {

        vraieAction = "RÉGLER";

    }


    const module =
        choisirModule(
            appareil,
            vraieAction
        );


    return {

        appareil: appareil.nom,

        emoji: appareil.emoji,

        piece: piece,

        action: vraieAction,

        module: module,

        valeur: valeur || "aucune"

    };

}


/* =====================================================
   DÉCOUPAGE INTELLIGENT
===================================================== */

function decouperPhrase(phrase) {

    let texte = nettoyer(phrase);


    /*
       Séparateurs forts.
    */

    texte = texte
        .replace(/\s+puis\s+/g, "|")
        .replace(/\s+ensuite\s+/g, "|")
        .replace(/\s+après\s+/g, "|")
        .replace(/\s+apres\s+/g, "|")
        .replace(/;/g, "|");


    /*
       "et" seulement devant une nouvelle action.
    */

    const actions = [

        "allume",
        "allumer",
        "éteins",
        "eteins",
        "ouvre",
        "ouvrir",
        "ferme",
        "fermer",
        "mets",
        "met",
        "mettre",
        "active",
        "activer",
        "lance",
        "lancer",
        "monte",
        "monter",
        "descends",
        "descendre",
        "baisse",
        "baisser",
        "verrouille",
        "verrouiller"

    ];


    for (const action of actions) {

        const regex =
            new RegExp(
                "\\s+et\\s+(" +
                action +
                ")\\b",
                "gi"
            );

        texte =
            texte.replace(
                regex,
                "|$1"
            );

    }


    /*
       Virgules.
    */

    texte =
        texte.replace(/,/g, "|");


    return texte
        .split("|")
        .map(x => x.trim())
        .filter(x => x.length > 0);

}


/* =====================================================
   COMMANDE MULTIPLE
===================================================== */

function analyserPhrase(phrase) {

    const morceaux =
        decouperPhrase(phrase);


    const commandes = [];


    for (const morceau of morceaux) {

        const commande =
            analyserCommande(morceau);


        if (commande) {

            commandes.push(commande);

        }

    }


    if (commandes.length === 0) {

        resultat.innerHTML =

            "🤖 <strong>HomeAI :</strong><br><br>" +

            "Je n'ai pas compris cette phrase.<br><br>" +

            "Essaie :<br>" +

            "« Allume la lumière et ouvre les volets »";

        return;

    }


    let html =

        "🧠 <strong>J'ai compris " +
        commandes.length +
        " commande(s)</strong>";


    commandes.forEach(
        (commande, index) => {

            html += `

            <div class="commande">

                <strong>
                ${index + 1}️⃣
                </strong>

                <br><br>

                📦 Appareil :
                <strong>
                ${commande.emoji}
                ${commande.appareil}
                </strong>

                <br>

                🏠 Pièce :
                <strong>
                ${commande.piece}
                </strong>

                <br>

                ⚙️ Action :
                <strong>
                ${commande.action}
                </strong>

                <br>

                🔧 Module :
                <strong>
                ${commande.module}
                </strong>

                <br>

                📊 Valeur :
                <strong>
                ${commande.valeur}
                </strong>

            </div>

            `;

        }
    );


    html +=

        "<br>📡 <strong>" +
        commandes.length +
        " commande(s) prête(s).</strong>";


    resultat.innerHTML = html;

}


/* =====================================================
   AFFICHAGE DES APPAREILS
===================================================== */

function afficherMaison() {

    listeMaison.innerHTML = "";


    for (const appareil of appareils) {

        const div =
            document.createElement("div");

        div.className = "objet";


        const modules =
            appareil.modules
                .map(
                    module =>
                        module === "electronique"
                        ? "⚡ électronique"
                        : "🤖 mécanique"
                )
                .join(" + ");


        div.innerHTML =

            appareil.emoji +
            " <strong>" +
            appareil.nom +
            "</strong>" +

            " — " +

            appareil.pieces.join(", ") +

            "<br>" +

            "<span class='badge'>" +
            modules +
            "</span>";


        listeMaison.appendChild(div);

    }

}
