<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeAI V0.5.1</title>

<style>
body {
    margin: 0;
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    font-size: 40px;
    margin-bottom: 5px;
}

.status {
    color: #aaa;
    margin-bottom: 30px;
}

#micro {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: none;
    font-size: 60px;
    cursor: pointer;
}

#micro.ecoute {
    transform: scale(1.08);
}

#texte {
    margin-top: 30px;
    font-size: 21px;
    min-height: 40px;
}

#resultat {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    background: #1c1e23;
    text-align: left;
    font-size: 18px;
    line-height: 1.7;
}

#appareils {
    margin-top: 25px;
    padding: 20px;
    border-radius: 20px;
    background: #181a1f;
    text-align: left;
}

.appareil {
    padding: 10px 0;
    border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<div class="container">

<h1>🏠 HomeAI</h1>

<div class="status" id="status">
Prêt à écouter
</div>

<button id="micro">🎙️</button>

<div id="texte">
Appuie sur le micro et parle.
</div>

<div id="resultat">
🤖 HomeAI : aucune commande.
</div>

<div id="appareils">

<h2>🏠 Maison</h2>

<div class="appareil">
📺 Salon → TV → 📡 électronique
</div>

<div class="appareil">
💡 Salon → Lumière → 📡 électronique
</div>

<div class="appareil">
🪟 Salon → Volets → 📡 électronique
</div>

<div class="appareil">
🍳 Cuisine → Four → 📡 électronique
</div>

<div class="appareil">
❄️ Cuisine → Frigo → 🤖 mécanique
</div>

<div class="appareil">
💡 Chambre → Lumière → 📡 électronique
</div>

</div>

</div>


<script>

/* =========================================
   RECONNAISSANCE VOCALE
========================================= */

const micro = document.getElementById("micro");
const texte = document.getElementById("texte");
const resultat = document.getElementById("resultat");
const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.innerText =
        "Reconnaissance vocale non disponible.";

} else {

    const reconnaissance = new SpeechRecognition();

    reconnaissance.lang = "fr-FR";
    reconnaissance.continuous = false;
    reconnaissance.interimResults = false;


    micro.addEventListener("click", () => {

        try {

            reconnaissance.start();

            status.innerText = "🎙️ J'écoute...";
            micro.classList.add("ecoute");

        } catch (erreur) {

            console.log(erreur);

        }

    });


    reconnaissance.onresult = function(event) {

        const commande =
            event.results[0][0].transcript;

        texte.innerText =
            "🗣️ « " + commande + " »";

        analyserCommande(commande);

    };


    reconnaissance.onend = function() {

        status.innerText = "Prêt à écouter";

        micro.classList.remove("ecoute");

    };


    reconnaissance.onerror = function(event) {

        status.innerText =
            "Erreur : " + event.error;

        micro.classList.remove("ecoute");

    };

}


/* =========================================
   BASE DES APPAREILS
========================================= */

const appareils = [

    {
        nom: "TV",
        piece: "salon",
        type: "electronique"
    },

    {
        nom: "LUMIERE",
        piece: "salon",
        type: "electronique"
    },

    {
        nom: "VOLETS",
        piece: "salon",
        type: "electronique"
    },

    {
        nom: "FOUR",
        piece: "cuisine",
        type: "electronique"
    },

    {
        nom: "FRIGO",
        piece: "cuisine",
        type: "mecanique"
    },

    {
        nom: "LUMIERE",
        piece: "chambre",
        type: "electronique"
    }

];


/* =========================================
   VOCABULAIRE HOMEAI
========================================= */

const vocabulaire = {

    allumer: [
        "allume",
        "allumer",
        "allumes",
        "allume-moi",
        "allume moi",
        "allumez",
        "active",
        "activer",
        "actives",
        "active-moi",
        "démarre",
        "demarre",
        "démarrer",
        "demarrer",
        "lance",
        "lancer",
        "lances",
        "mets",
        "met",
        "mettre",
        "met-moi",
        "met moi"
    ],

    eteindre: [
        "éteins",
        "eteins",
        "éteindre",
        "eteindre",
        "éteint",
        "eteint",
        "éteignez",
        "eteignez",
        "éteins-moi",
        "eteins moi",
        "coupe",
        "couper",
        "coupes",
        "coupez",
        "désactive",
        "desactive",
        "désactiver",
        "desactiver",
        "arrête",
        "arrete",
        "arrêter",
        "arreter"
    ],

    ouvrir: [
        "ouvre",
        "ouvrir",
        "ouvres",
        "ouvrez",
        "ouvre-moi",
        "ouvre moi",
        "ouvre-le",
        "ouvre le",
        "ouvre-la",
        "ouvre la",
        "ouvert"
    ],

    fermer: [
        "ferme",
        "fermer",
        "fermes",
        "fermez",
        "ferme-moi",
        "ferme moi",
        "ferme-le",
        "ferme le",
        "ferme-la",
        "ferme la",
        "fermé",
        "fermee",
        "fermer ça",
        "ferme ça"
    ]

};


/* =========================================
   FONCTION POUR CHERCHER UN MOT
========================================= */

function contientUnMot(texte, liste) {

    for (const mot of liste) {

        if (texte.includes(mot)) {
            return true;
        }

    }

    return false;
}


/* =========================================
   ANALYSE DE LA COMMANDE
========================================= */

function analyserCommande(commande) {

    let c = commande.toLowerCase();

    /*
       On enlève quelques signes
       pour faciliter la compréhension.
    */

    c = c
        .replace(/[.,!?]/g, "")
        .trim();


    let appareil = null;
    let action = null;
    let piece = null;
    let valeur = null;


    /* =====================================
       DÉTECTION DE LA PIÈCE
    ===================================== */

    if (
        c.includes("salon") ||
        c.includes("séjour") ||
        c.includes("sejour")
    ) {

        piece = "salon";

    }

    else if (
        c.includes("chambre") ||
        c.includes("chambre à coucher")
    ) {

        piece = "chambre";

    }

    else if (
        c.includes("cuisine")
    ) {

        piece = "cuisine";

    }

    else if (
        c.includes("salle de bain") ||
        c.includes("sdb")
    ) {

        piece = "salle de bain";

    }


    /* =====================================
       TÉLÉVISION
    ===================================== */

    if (
        c.includes("télé") ||
        c.includes("tele") ||
        c.includes("télévision") ||
        c.includes("television") ||
        c.includes("tv")
    ) {

        appareil = "TV";


        if (
            contientUnMot(c, vocabulaire.allumer) ||
            c.includes("regarder la télé") ||
            c.includes("regarder la tv") ||
            c.includes("je veux regarder")
        ) {

            action = "ALLUMER";

        }


        else if (
            contientUnMot(c, vocabulaire.eteindre) ||
            c.includes("je ne veux plus regarder")
        ) {

            action = "ÉTEINDRE";

        }

    }


    /* =====================================
       LUMIÈRE
    ===================================== */

    else if (
        c.includes("lumière") ||
        c.includes("lumiere") ||
        c.includes("lampe") ||
        c.includes("éclairage") ||
        c.includes("eclairage")
    ) {

        appareil = "LUMIERE";


        if (
            contientUnMot(c, vocabulaire.allumer)
        ) {

            action = "ALLUMER";

        }


        else if (
            contientUnMot(c, vocabulaire.eteindre)
        ) {

            action = "ÉTEINDRE";

        }

    }


    /* =====================================
       VOLETS
    ===================================== */

    else if (
        c.includes("volet") ||
        c.includes("volets") ||
        c.includes("store") ||
        c.includes("stores")
    ) {

        appareil = "VOLETS";


        if (
            contientUnMot(c, vocabulaire.ouvrir)
        ) {

            action = "OUVRIR";

        }


        else if (
            contientUnMot(c, vocabulaire.fermer)
        ) {

            action = "FERMER";

        }

    }


    /* =====================================
       FRIGO
    ===================================== */

    else if (
        c.includes("frigo") ||
        c.includes("réfrigérateur") ||
        c.includes("refrigerateur") ||
        c.includes("frigidaire")
    ) {

        appareil = "FRIGO";


        if (
            contientUnMot(c, vocabulaire.ouvrir)
        ) {

            action = "OUVRIR";

        }


        else if (
            contientUnMot(c, vocabulaire.fermer)
        ) {

            action = "FERMER";

        }

    }


    /* =====================================
       FOUR
    ===================================== */

    else if (
        c.includes("four")
    ) {

        appareil = "FOUR";


        /*
           On cherche une température
           entre 50 et 300°C.
        */

        for (let i = 50; i <= 300; i++) {

            if (c.includes(i.toString())) {

                valeur = i + "°C";

                action = "RÉGLER";

                break;

            }

        }


        /*
           Si aucune température n'est
           donnée, on peut quand même
           comprendre une commande simple.
        */

        if (
            action === null &&
            contientUnMot(c, vocabulaire.allumer)
        ) {

            action = "ALLUMER";

        }


        if (
            action === null &&
            contientUnMot(c, vocabulaire.eteindre)
        ) {

            action = "ÉTEINDRE";

        }

    }


    /* =====================================
       CHAUFFAGE
    ===================================== */

    else if (
        c.includes("chauffage") ||
        c.includes("radiateur") ||
        c.includes("chauffe")
    ) {

        appareil = "CHAUFFAGE";


        for (let i = 5; i <= 35; i++) {

            if (c.includes(i.toString())) {

                valeur = i + "°C";

                action = "RÉGLER";

                break;

            }

        }


        if (
            action === null &&
            contientUnMot(c, vocabulaire.allumer)
        ) {

            action = "ALLUMER";

        }


        if (
            action === null &&
            contientUnMot(c, vocabulaire.eteindre)
        ) {

            action = "ÉTEINDRE";

        }

    }


    /* =====================================
       MUSIQUE / SPOTIFY
    ===================================== */

    else if (
        c.includes("spotify") ||
        c.includes("musique") ||
        c.includes("chanson") ||
        c.includes("son")
    ) {

        appareil = "MUSIQUE";


        if (
            contientUnMot(c, vocabulaire.allumer) ||
            c.includes("joue") ||
            c.includes("jouer") ||
            c.includes("écoute") ||
            c.includes("ecoute")
        ) {

            action = "LANCER";

            valeur = "Spotify";

        }


        else if (
            contientUnMot(c, vocabulaire.eteindre)
        ) {

            action = "ARRÊTER";

        }

    }


    /* =====================================
       MICRO-ONDES
    ===================================== */

    else if (
        c.includes("micro-onde") ||
        c.includes("micro onde") ||
        c.includes("microondes")
    ) {

        appareil = "MICRO-ONDES";


        if (
            contientUnMot(c, vocabulaire.allumer)
        ) {

            action = "ALLUMER";

        }


        else if (
            contientUnMot(c, vocabulaire.eteindre)
        ) {

            action = "ÉTEINDRE";

        }

    }


    /* =====================================
       RECHERCHE DE L'APPAREIL
    ===================================== */

    if (
        appareil === null ||
        action === null
    ) {

        resultat.innerHTML =

            "🤖 <strong>HomeAI :</strong><br><br>" +

            "Je n'ai pas encore compris cette commande.<br><br>" +

            "🗣️ Essaie de la reformuler.";

        return;

    }


    let appareilTrouve = null;


    for (const a of appareils) {

        if (a.nom === appareil) {

            if (
                piece === null ||
                a.piece === piece
            ) {

                appareilTrouve = a;

                break;

            }

        }

    }


    /* =====================================
       APPAREIL TROUVÉ
    ===================================== */

    if (appareilTrouve !== null) {

        resultat.innerHTML =

            "🧠 <strong>HomeAI a compris :</strong><br><br>" +

            "📦 Appareil : <strong>" +
            appareilTrouve.nom +
            "</strong><br>" +

            "🏠 Pièce : <strong>" +
            appareilTrouve.piece +
            "</strong><br>" +

            "⚙️ Action : <strong>" +
            action +
            "</strong><br>" +

            "🔧 Module : <strong>" +
            appareilTrouve.type +
            "</strong><br>" +

            "📊 Valeur : <strong>" +
            (valeur || "aucune") +
            "</strong>";

    }

    else {

        resultat.innerHTML =

            "🤖 <strong>HomeAI :</strong><br><br>" +

            "J'ai compris la commande, mais je ne trouve pas " +

            "<strong>" +
            appareil +
            "</strong>" +

            " dans cette pièce.";

    }

}

</script>

</body>
</html>
