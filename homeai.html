/* =====================================================

const vocabulaire = {

    ]

};


/* =====================================================
   UTILITAIRES
===================================================== */

function contient(texte, liste) {

    return liste.some(
        mot => texte.includes(mot)
    );

}


function nettoyer(texte) {

    return texte
        .toLowerCase()
        .replace(/[!?]/g, "")
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   PIÈCE
===================================================== */

function detecterPiece(texte) {

    if (
        texte.includes("salle de bain") ||
        texte.includes("salle de bains")
    ) {
        return "salle de bain";
    }

    if (texte.includes("chambre")) {
        return "chambre";
    }

    if (texte.includes("cuisine")) {
        return "cuisine";
    }

    if (
        texte.includes("salon") ||
        texte.includes("séjour") ||
        texte.includes("sejour")
    ) {
        return "salon";
    }

    return null;
}


/* =====================================================
   APPAREIL
===================================================== */

function trouverAppareil(texte) {

    const liste =
        [...appareils].sort(
            (a, b) => {

                const aMax =
                    Math.max(
                        ...a.mots.map(
                            x => x.length
                        )
                    );

                const bMax =
                    Math.max(
                        ...b.mots.map(
                            x => x.length
                        )
                    );

                return bMax - aMax;

            }
        );


    for (const appareil of liste) {

        for (const mot of appareil.mots) {

            if (texte.includes(mot)) {

                return appareil;

            }

        }

    }

    return null;
}


/* =====================================================
   ACTION
===================================================== */

function detecterAction(texte) {

    if (
        contient(
            texte,
            vocabulaire.ouvrir
        )
    ) {
        return "OUVRIR";
    }

    if (
        contient(
            texte,
            vocabulaire.fermer
        )
    ) {
        return "FERMER";
    }

    if (
        contient(
            texte,
            vocabulaire.verrouiller
        )
    ) {
        return "VERROUILLER";
    }

    if (
        contient(
            texte,
            vocabulaire.monter
        )
    ) {
        return "MONTER";
    }

    if (
        contient(
            texte,
            vocabulaire.descendre
        )
    ) {
        return "DESCENDRE";
    }

    if (
        contient(
            texte,
            vocabulaire.eteindre
        )
    ) {
        return "ÉTEINDRE";
    }

    if (
        contient(
            texte,
            vocabulaire.allumer
        )
    ) {
        return "ALLUMER";
    }

    return null;
}


/* =====================================================
   TEMPÉRATURE
===================================================== */

function detecterValeur(texte) {

    const match =
        texte.match(
            /(\d{1,3})\s*(?:°|degr[eé]s?)/i
        );

    if (match) {

        return match[1] + "°C";

    }

    return null;
}


/* =====================================================
   MODULE
===================================================== */

function choisirModule(
    appareil,
    action
) {

    const mecanique = [
        "OUVRIR",
        "FERMER",
        "MONTER",
        "DESCENDRE",
        "VERROUILLER"
    ];


    if (
        mecanique.includes(action) &&
        appareil.modules.includes("mecanique")
    ) {

        return "🤖 MÉCANIQUE";

    }


    if (
        appareil.modules.includes(
            "electronique"
        )
    ) {

        return "⚡ ÉLECTRONIQUE";

    }


    return "❓ INCONNU";
}


/* =====================================================
   DÉCOUPAGE
===================================================== */

function decouperPhrase(phrase) {

    let texte =
        nettoyer(phrase);


    texte =
        texte
        .replace(
            /\s+puis\s+/g,
            "|"
        )
        .replace(
            /\s+ensuite\s+/g,
            "|"
        )
        .replace(
            /\s+après\s+/g,
            "|"
        )
        .replace(
            /\s+apres\s+/g,
            "|"
        )
        .replace(
            /;/g,
            "|"
        );


    const actions = [

        "allume",
        "allumer",
        "éteins",
        "eteins",
        "ouvre",
        "ouvrir",
        "ferme",
        "fermer",
        "mets",
        "met",
        "mettre",
        "active",
        "activer",
        "lance",
        "lancer",
        "monte",
        "monter",
        "descends",
        "descendre",
        "baisse",
        "baisser",
        "verrouille",
        "verrouiller"

    ];


    for (const action of actions) {

        const regex =
            new RegExp(
                "\\s+et\\s+(" +
                action +
                ")\\b",
                "gi"
            );

        texte =
            texte.replace(
                regex,
                "|$1"
            );

    }


    texte =
        texte.replace(
            /,/g,
            "|"
        );


    return texte
        .split("|")
        .map(x => x.trim())
        .filter(x => x);
}


/* =====================================================
   ANALYSE D'UNE COMMANDE
===================================================== */

function analyserCommande(texte) {

    const appareil =
        trouverAppareil(texte);

    const action =
        detecterAction(texte);

    const piece =
        detecterPiece(texte);

    const valeur =
        detecterValeur(texte);


    if (
        !appareil ||
        !action
    ) {

        return null;

    }


    let vraieAction =
        valeur
        ? "RÉGLER"
        : action;


    let vraiePiece =
        piece;


    if (!vraiePiece) {

        vraiePiece =
            appareil.pieces[0];

    }


    if (
        !appareil.pieces.includes(
            vraiePiece
        )
    ) {

        vraiePiece =
            appareil.pieces[0];

    }


    return {

        appareil: appareil.nom,

        emoji: appareil.emoji,

        piece: vraiePiece,

        action: vraieAction,

        valeur: valeur || "aucune",

        module:
            choisirModule(
                appareil,
                vraieAction
            )

    };

}


/* =====================================================
   EXÉCUTION
===================================================== */

function executerCommande(commande) {

    return new Promise(
        resolve => {

            setTimeout(
                () => {

                    const maintenant =
                        new Date()
                        .toLocaleTimeString(
                            "fr-FR"
                        );


                    const message =

                        "📡 Module reçu : " +

                        commande.module +

                        "<br>" +

                        "🏠 " +

                        commande.piece +

                        "<br>" +

                        commande.emoji +

                        " " +

                        commande.appareil +

                        "<br>" +

                        "⚙️ " +

                        commande.action +

                        "<br>" +

                        (
                            commande.valeur !== "aucune"
                            ? "📊 " +
                              commande.valeur
                            : ""
                        );


                    ajouterHistorique(
                        maintenant +
                        " — " +
                        commande.action +
                        " " +
                        commande.appareil
                    );


                    resolve(message);

                },

                600

            );

        }
    );

}


/* =====================================================
   EXÉCUTION DE TOUTES LES COMMANDES
===================================================== */

async function executerToutes(
    commandes
) {

    etat.innerHTML =
        "📡 Préparation de " +
        commandes.length +
        " commande(s)...";


    for (
        let i = 0;
        i < commandes.length;
        i++
    ) {

        const commande =
            commandes[i];


        etat.innerHTML =

            "📡 Exécution " +
            (i + 1) +
            "/" +
            commandes.length +

            "<br><br>" +

            "⏳ " +
            commande.emoji +
            " " +
            commande.appareil;


        const message =
            await executerCommande(
                commande
            );


        document
            .getElementById(
                "execution-" + i
            )
            .innerHTML =

            message +

            "<div class='succes'>" +
            "✅ Commande exécutée" +
            "</div>";

    }


    etat.innerHTML =

        "🟢 <strong>Terminé</strong><br><br>" +

        "Toutes les commandes ont été " +
        "traitées par HomeAI.";

}


/* =====================================================
   ANALYSE PRINCIPALE
===================================================== */

async function analyserPhrase(
    phrase
) {

    texte.innerText =
        "🗣️ « " +
        phrase +
        " »";


    const morceaux =
        decouperPhrase(
            phrase
        );


    const commandes = [];


    for (
        const morceau of morceaux
    ) {

        const commande =
            analyserCommande(
                morceau
            );


        if (commande) {

            commandes.push(
                commande
            );

        }

    }


    if (
        commandes.length === 0
    ) {

        resultat.innerHTML =

            "❌ HomeAI n'a pas compris.<br><br>" +

            "Essaie par exemple :<br>" +

            "« Allume la lumière et ouvre les volets »";

        return;

    }


    let html =

        "🧠 <strong>" +

        commandes.length +

        " commande(s) comprise(s)</strong>";


    commandes.forEach(
        (commande, index) => {

            html += `

            <div class="commande">

                <strong>
                ${index + 1}️⃣
                </strong>

                <br><br>

                ${commande.emoji}
                <strong>
                ${commande.appareil}
                </strong>

                <br>

                🏠 ${commande.piece}

                <br>

                ⚙️ ${commande.action}

                <br>

                🔧 ${commande.module}

                <br>

                📊 ${commande.valeur}

                <div
                    class="execution"
                    id="execution-${index}"
                >
                    ⏳ En attente...
                </div>

            </div>

            `;

        }
    );


    resultat.innerHTML =
        html;


    await executerToutes(
        commandes
    );

}


/* =====================================================
   HISTORIQUE
===================================================== */

function ajouterHistorique(message) {

    if (
        historique.innerText ===
        "Aucune commande pour le moment."
    ) {

        historique.innerHTML = "";

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "log";


    div.innerHTML =
        "✅ " +
        message;


    historique.prepend(
        div

}

                "div"
            );


        div.className =
            "objet";


        const modules =
            appareil.modules
            .map(
                module =>

                    module ===
                    "electronique"

                    ? "⚡ électronique"

                    : "🤖 mécanique"
            )
            .join(" + ");


        div.innerHTML =

            appareil.emoji +

            " <strong>" +

            appareil.nom +

            "</strong>" +

            "<br>" +

            "🏠 " +

            appareil.pieces.join(
                ", "
            ) +

            "<br>" +

            "<span class='badge'>" +

            modules +

            "</span>";


        listeMaison.appendChild(
            div
        );

    }

}


afficherMaison();

</script>

</body>
</html>
